<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Der Die Das</title>
<meta name="description" content="Learn German nouns with their articles — works offline.">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Der Die Das">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="b-der">der</span><span class="b-die">die</span><span class="b-das">das</span></div>
  <div class="top-right"><span id="streak" class="pill" title="Daily streak">🔥 0</span></div>
</header>

<main id="view" aria-live="polite"></main>

<nav class="tabs" aria-label="Main">
  <button data-tab="quiz" class="active"><span>🎯</span>Quiz</button>
  <button data-tab="cards"><span>🃏</span>Cards</button>
  <button data-tab="words"><span>📚</span>Words</button>
  <button data-tab="tricks"><span>💡</span>Tricks</button>
  <button data-tab="stats"><span>📊</span>Progress</button>
</nav>

<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
  <div class="sheet-bg" data-close></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>
<div id="toast" class="toast hidden"></div>

<script src="words.js"></script>
<script src="app.js"></script>
</body>
</html>
